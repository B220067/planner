  :root { --ink: #1c2128; --muted: #667085; --line: #c3cad2; --late: #a8281d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f8; color: var(--ink);
    font: 14px/1.45 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { width: min(360px, calc(100vw - 40px)); }
  h1 { font: 600 26px/1.1 "Plus Jakarta Sans", -apple-system, system-ui, sans-serif; margin: 0 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); background: #fff; font: inherit; border-radius: 2px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button { margin-top: 12px; padding: 9px 18px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font: inherit; border-radius: 2px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .auto main { visibility: hidden; }
  #msg { min-height: 20px; margin-top: 12px; color: var(--late); font-size: 13px; }
</style>

      if (document.readyState === 'complete') return setTimeout(resolve, 0);
      window.addEventListener('load', function () { setTimeout(resolve, 0); });
    });
  }
  (async function () {
    var raw = null;
    try { raw = sessionStorage.getItem(SKEY); } catch (e) { /* fine */ }
    if (!raw) return;
    document.documentElement.className = 'auto'; // hide the form while the planner opens
    try {
      var key = await crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, false, ['decrypt']);
      await loaded();
      await open(key);
    } catch (e) {
      document.documentElement.className = '';
      try { sessionStorage.removeItem(SKEY); } catch (x) { /* fine */ }
    }
  })();

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    go.disabled = true; msg.textContent = 'Unlocking...';
    try {
      var key = await deriveKey(pw);
      var raw = await crypto.subtle.exportKey('raw', key);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));
      var sraw = await deriveSync(pw);
      try { sessionStorage.setItem(SKEY, toB64(raw)); sessionStorage.setItem(SYNCKEY, sraw); } catch (x) { /* fine */ }
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    } catch (err) {
      fails++;
      msg.textContent = 'That passphrase did not work.';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
      // a short pause after each miss; the real protection is the passphrase itself
      setTimeout(function () { go.disabled = false; }, Math.min(500 * fails, 5000));
    }
  });
})();
</script>
