  :root { --ink: #1c2128; --muted: #667085; --line: #c3cad2; --late: #a8281d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: grid; place-items: center; background: #f6f7f8; color: var(--ink);
    font: 14px/1.45 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { width: min(360px, calc(100vw - 40px)); }
  h1 { font: 600 26px/1.1 "Plus Jakarta Sans", -apple-system, system-ui, sans-serif; margin: 0 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type="password"], input[type="text"] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); background: #fff; font: inherit; border-radius: 2px; }
  /* the account name some password managers want to see beside the password; invisible and out of the way */
  .acct { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  @media (max-width: 700px) { input[type="password"], input[type="text"] { font-size: 16px; padding: 12px; } button { padding: 12px 22px; font-size: 16px; } }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button { margin-top: 12px; padding: 9px 18px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font: inherit; border-radius: 2px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .auto main { visibility: hidden; }
  #msg { min-height: 20px; margin-top: 12px; color: var(--late); font-size: 13px; }
</style>

  var SKEY = 'planner.key';
  var SYNCKEY = 'planner.sync'; // a second key, for syncing; the same on every computer
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');
  var fails = 0;

  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }

  async function open(key) {
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));
    var html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }

  async function deriveKey(pass) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function deriveSync(pass) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveBits']);
    return toB64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode('bench-planner/sync/v1'), iterations: 600000, hash: 'SHA-256' }, base, 256));
  }

  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'This browser cannot unlock the page here. Open it over https.';
    go.disabled = true;
    return;
  }

  // Wait until this page has fully loaded first: replacing the page while it is still
  // loading leaves the unlock form sitting on top of the planner.
  function loaded() {
    return new Promise(function (resolve) {
      if (document.readyState === 'complete') return setTimeout(resolve, 0);
      window.addEventListener('load', function () { setTimeout(resolve, 0); });
    });
  }
  // Already unlocked in this tab? Reuse the key and open straight away.
  (async function () {
    try { localStorage.removeItem('planner.remember'); } catch (e) { /* fine */ } // clears the old "stay unlocked" option if it was ever ticked
    var raw = null;
    try { raw = sessionStorage.getItem(SKEY); } catch (e) { /* fine */ }
    if (!raw) return;
    document.documentElement.className = 'auto'; // hide the form while the planner opens
    try {

      await loaded();
      await open(key);

      document.documentElement.className = '';
      try { sessionStorage.removeItem(SKEY); sessionStorage.removeItem(SYNCKEY); } catch (x) { /* fine */ }
    }

  document.getElementById('f').addEventListener('submit', async function (e) {

    var pw = document.getElementById('pw').value;
    if (!pw) return;
    go.disabled = true; msg.textContent = 'Unlocking...';
    try {
      var key = await deriveKey(pw);
      var raw = await crypto.subtle.exportKey('raw', key);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));

      try { sessionStorage.setItem(SKEY, toB64(raw)); sessionStorage.setItem(SYNCKEY, sraw); } catch (x) { /* fine */ }

      document.open(); document.write(html); document.close();

      fails++;
      msg.textContent = 'That passphrase did not work.';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();

      setTimeout(function () { go.disabled = false; }, Math.min(500 * fails, 5000));
    }
