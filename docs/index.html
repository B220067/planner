  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f8; color: var(--ink);

  main { width: min(360px, calc(100vw - 40px)); }
  h1 { font: 600 26px/1.1 "Plus Jakarta Sans", -apple-system, system-ui, sans-serif; margin: 0 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); background: #fff; font: inherit; border-radius: 2px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button { margin-top: 12px; padding: 9px 18px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font: inherit; border-radius: 2px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; color: var(--late); font-size: 13px; }
</style>

  var SKEY = 'planner.key';
  var SYNCKEY = 'planner.sync'; // a second key, for syncing; the same on every computer
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');
  var fails = 0;

  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }

  async function open(key) {
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));
    var html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }

  async function deriveKey(pass) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function deriveSync(pass) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveBits']);
    return toB64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode('bench-planner/sync/v1'), iterations: 600000, hash: 'SHA-256' }, base, 256));
  }

  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'This browser cannot unlock the page here. Open it over https.';
    go.disabled = true;
    return;
  }

  // Already unlocked in this tab? Reuse the key kept for the tab's lifetime.
  (async function () {
    try {
      var raw = sessionStorage.getItem(SKEY);
      if (raw) {
        var key = await crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, false, ['decrypt']);
        await open(key);
      }
    } catch (e) { try { sessionStorage.removeItem(SKEY); } catch (x) { /* fine */ } }
  })();

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    go.disabled = true; msg.textContent = 'Unlocking...';
    try {
      var key = await deriveKey(pw);
      var raw = await crypto.subtle.exportKey('raw', key);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));
      var sraw = await deriveSync(pw);
      try { sessionStorage.setItem(SKEY, toB64(raw)); sessionStorage.setItem(SYNCKEY, sraw); } catch (x) { /* fine */ }

      document.open(); document.write(html); document.close();
    } catch (err) {
      fails++;
      msg.textContent = 'That passphrase did not work.';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
      // a short pause after each miss; the real protection is the passphrase itself
      setTimeout(function () { go.disabled = false; }, Math.min(500 * fails, 5000));
    }
  });
